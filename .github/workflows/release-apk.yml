name: Publish APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Check release keywords
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.keywords.outputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan all commits in this push
        id: keywords
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              requested = True
          else:
              before, after = event['before'], event['after']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (before, after)):
                  raise SystemExit('Invalid push commit range')
              if set(before) == {'0'}:
                  revision = after
              else:
                  if subprocess.run(['git', 'cat-file', '-e', before + '^{commit}'],
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                      # A force-push may leave the previous tip outside the checkout history.
                      subprocess.run(['git', 'fetch', '--no-tags', 'origin', before], check=True)
                  revision = before + '..' + after
              messages = subprocess.check_output(
                  ['git', 'log', '--format=%B%x00', revision], encoding='utf-8')
              pattern = (
                  r'发布|发版|新版|版本更新|'
                  r'\b(?:releas(?:e[sd]?|ing)|publish(?:ed|es|ing)?)\b|'
                  r'\bnew[\s_-]+version\b|'
                  r'\b(?:bump[\s_-]+version|version[\s_-]+bump)\b'
              )
              requested = bool(re.search(pattern, messages, re.IGNORECASE | re.ASCII))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('release=' + str(requested).lower() + '\n')
          print('Release requested' if requested else 'No release keyword; skipping APK build')
          PY

  release:
    name: Build and publish signed APK
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: apk-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Configure all four repository secrets using the SAME key as existing installs.
      # Never generate a new debug/release key on each ephemeral runner.
      - name: Restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing repository secret: $secret. A persistent signing key is required."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # Install only current packages; never request the obsolete 'tools' package.
          packages: platform-tools

      - name: Install project SDK and NDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.2.13676358'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      # Versions come exclusively from app/build.gradle; never override them in CI.
      - name: Build release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon

      # Re-sign only the built APK, leaving the repository's Gradle configuration untouched.
      - name: Sign release APK with persistent key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v4-signing-enabled false --out "$RUNNER_TEMP/CarDockBar-release.apk" \
            app/build/outputs/apk/release/CarDockBar-release.apk
          mv "$RUNNER_TEMP/CarDockBar-release.apk" app/build/outputs/apk/release/CarDockBar-release.apk

      - name: Verify APK and create update metadata
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/CarDockBar-release.apk
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          source = Path('app/build/outputs/apk/release/CarDockBar-release.apk')
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools/34.0.0/aapt'
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(source)], encoding='utf-8')
          package = re.search(
              r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", badging, re.MULTILINE)
          min_sdk = re.search(r"^sdkVersion:'(\d+)'", badging, re.MULTILINE)
          if not package or not min_sdk:
              raise SystemExit('Cannot read APK version/package metadata')
          application_id, version_code, version_name = package.groups()
          if application_id != 'com.car.dockbar' or not 1 <= int(version_code) <= 2100000000:
              raise SystemExit('Unexpected APK package or invalid versionCode')
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          declared_code = re.search(r'^\s*versionCode\s+(\d+)\s*(?://[^\n]*)?$', gradle, re.MULTILINE)
          declared_name = re.search(r'''^\s*versionName\s+["']([^"']+)["']\s*(?://[^\n]*)?$''', gradle, re.MULTILINE)
          if not declared_code or not declared_name:
              raise SystemExit('Cannot read versionCode/versionName from app/build.gradle')
          if int(version_code) != int(declared_code.group(1)) or version_name != declared_name.group(1):
              raise SystemExit('APK version differs from app/build.gradle; refusing to publish')
          if not re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z.+-]*', version_name):
              raise SystemExit('versionName is not safe for a release tag/asset name')
          tag = 'v' + version_name
          filename = 'CarDockBar-' + version_name + '.apk'
          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          apk = dist / filename
          shutil.copy2(source, apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          metadata = {
              'schemaVersion': 1,
              'applicationId': application_id,
              'versionCode': int(version_code),
              'versionName': version_name,
              'minSdk': int(min_sdk.group(1)),
              'tag': tag,
              'commit': os.environ['GITHUB_SHA'],
              'builtAt': datetime.now(timezone.utc).isoformat(),
              'apk': {
                  'name': filename,
                  'url': ('https://github.com/' + os.environ['GITHUB_REPOSITORY']
                          + '/releases/download/' + quote(tag, safe='') + '/' + quote(filename, safe='')),
                  'sha256': digest,
                  'size': apk.stat().st_size,
              },
          }
          (dist / 'update.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (dist / 'SHA256SUMS').write_text(digest + '  ' + filename + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('RELEASE_TAG=' + tag + '\nVERSION_NAME=' + version_name + '\nVERSION_CODE=' + version_code + '\n')
          PY

      - name: Retain release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # No --clobber: rerunning a published run must not silently replace its APK.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make_latest=true
          if latest_body="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.body // ""' 2> "$RUNNER_TEMP/latest-release-error")"; then
            # Re-running an older failed build may publish it, but must not downgrade latest.
            version_marker='<!-- android-version-code: ([0-9]+) -->'
            if [[ "$latest_body" =~ $version_marker ]] && (( 10#${BASH_REMATCH[1]} > VERSION_CODE )); then
              make_latest=false
            fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/latest-release-error"; then
            cat "$RUNNER_TEMP/latest-release-error" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CarDockBar $VERSION_NAME" --generate-notes --latest="$make_latest" \
            --notes "<!-- android-version-code: $VERSION_CODE -->"$'\n\n'"Signed universal APK (arm64-v8a, armeabi-v7a, x86_64). See update.json and SHA256SUMS for version and integrity metadata."

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
